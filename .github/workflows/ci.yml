name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      # ── Linux dependencies ────────────────────────────────────────────────
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwxgtk3.2-dev \
            libgtk-3-dev \
            xvfb \
            graphviz

      # ── Windows dependencies (vcpkg) ──────────────────────────────────────
      - name: Set up vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: vcpkg.json

      # ── Configure ─────────────────────────────────────────────────────────
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DMODELER_BUILD_TESTS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DMODELER_BUILD_TESTS=ON

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # ── Test (unit tests have no GUI dependency) ──────────────────────────
      - name: Run unit tests
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure

      # ── Sanitizers (Debug / Linux only) ──────────────────────────────────
      - name: Configure with sanitizers
        if: runner.os == 'Linux' && matrix.build_type == 'Debug'
        run: |
          cmake -B build-asan -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMODELER_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build with sanitizers
        if: runner.os == 'Linux' && matrix.build_type == 'Debug'
        run: cmake --build build-asan --parallel

      - name: Run tests under sanitizers
        if: runner.os == 'Linux' && matrix.build_type == 'Debug'
        run: ctest --test-dir build-asan --output-on-failure

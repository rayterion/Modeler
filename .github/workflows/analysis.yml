name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  clang-format:
    name: clang-format check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM tools
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - name: Check formatting
        run: |
          $files = @(Get-ChildItem include, src -Recurse -Include *.h,*.cpp | ForEach-Object { $_.FullName })
          if ($files.Count -gt 0) {
            clang-format --dry-run --Werror --style=file $files
          }

  clang-tidy:
    name: clang-tidy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM tools
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: vcpkg.json

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Configure (generate compile_commands.json)
        run: |
          cmake -B build -S . `
            -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DMODELER_BUILD_TESTS=OFF

      - name: Run clang-tidy
        run: |
          $files = @(Get-ChildItem src -Recurse -Filter *.cpp | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            clang-tidy $file --p build --header-filter='.*(include|src).*\\.(h|hpp)$'
          }

  cppcheck:
    name: cppcheck
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          choco install cppcheck -y --no-progress
          # The choco cppcheck binary has FILESDIR baked in to a build-machine path (R:/winlibs64ucrt_stage/...).
          # Work around this by mapping R: to C:\ and creating the expected directory junction so cppcheck
          # can locate its cfg files at runtime.
          subst R: C:\
          New-Item -ItemType Directory -Force -Path "C:\winlibs64ucrt_stage\inst_cppcheck-2.14.0\share" | Out-Null
          New-Item -ItemType Junction -Path "C:\winlibs64ucrt_stage\inst_cppcheck-2.14.0\share\Cppcheck" `
            -Target "C:\Program Files\Cppcheck" | Out-Null

      - name: Run cppcheck
        run: |
          cppcheck `
            --enable=all `
            --std=c++17 `
            --suppress=missingIncludeSystem `
            --error-exitcode=1 `
            --inline-suppr `
            -I include `
            src

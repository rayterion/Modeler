name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── clang-format ──────────────────────────────────────────────────────────
  # Runs on ubuntu-latest: clang-format-18 is available via apt and the runner
  # boots ~3x faster than a Windows runner.
  clang-format:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format-18
        run: sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          files=$(find include src -name '*.h' -o -name '*.cpp')
          if [ -n "$files" ]; then
            echo "$files" | xargs clang-format-18 --dry-run --Werror --style=file
          fi

  # ── clang-tidy ────────────────────────────────────────────────────────────
  # Stays on windows-latest to analyse against the real MSVC/VS toolchain.
  # LLVM 20 is required: VS2026's STL headers assert "expected Clang 20 or newer"
  # when processed by an older clang front-end.
  clang-tidy:
    name: clang-tidy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 20
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20"

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: vcpkg.json

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Configure (generate compile_commands.json)
        run: |
          cmake -B build -S . `
            -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DMODELER_BUILD_TESTS=OFF

      - name: Run clang-tidy
        run: |
          $files = @(Get-ChildItem src -Recurse -Filter *.cpp | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            clang-tidy $file -p build --header-filter='.*(include|src).*\\.(h|hpp)$'
          }

  # ── cppcheck ──────────────────────────────────────────────────────────────
  # Runs on ubuntu-latest: the apt-packaged cppcheck is self-contained and
  # avoids the broken FILESDIR path that the choco Windows package has.
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=all \
            --std=c++17 \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            --inline-suppr \
            -I include \
            src
